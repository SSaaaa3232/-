  <rect x="280" y="465" width="260" height="88" rx="8" fill="url(#box-violet)" stroke="#a78bfa" stroke-width="1"/>
  <rect x="280" y="465" width="260" height="26" rx="8" fill="#7c3aed"/>
  <rect x="280" y="479" width="260" height="12" rx="0" fill="#7c3aed"/>
  <text x="410" y="483" text-anchor="middle" fill="#ede9fe" font-size="11" font-weight="700" class="phase-label">PHASE 2 · 核心发现提取</text>
  <text x="410" y="508" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">search-strategy.md 搜索 biz/page 源码</text>
  <text x="410" y="523" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">提取: auth payload / secrets / token 结构</text>
  <text x="410" y="538" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">FIU 框架 + evidence anchor + confidence</text>

  <line x1="410" y1="553" x2="410" y2="585" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== PHASE 3: CALL CHAIN ===== -->
  <rect x="280" y="590" width="260" height="80" rx="8" fill="url(#box-blue)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="280" y="590" width="260" height="26" rx="8" fill="#2563eb"/>
  <rect x="280" y="604" width="260" height="12" rx="0" fill="#2563eb"/>
  <text x="410" y="608" text-anchor="middle" fill="#dbeafe" font-size="11" font-weight="700" class="phase-label">PHASE 3 · 调用链复现</text>
  <text x="410" y="632" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">还原 HTTP 序列: METHOD + Headers + Body</text>
  <text x="410" y="647" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">标注 token/cookie 跨请求传递 + 解码</text>
  <text x="410" y="662" text-anchor="middle" fill="#64748b" font-size="9" class="phase-detail">不等待 Phase 3，Phase 2 有发现即可开始 ↓</text>

  <line x1="410" y1="670" x2="410" y2="700" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== PHASE 4: PoC TESTING ===== -->
  <rect x="230" y="705" width="360" height="110" rx="8" fill="url(#box-emerald)" stroke="#34d399" stroke-width="1.5"/>
  <rect x="230" y="705" width="360" height="26" rx="8" fill="#059669"/>
  <rect x="230" y="719" width="360" height="12" rx="0" fill="#059669"/>
  <text x="410" y="723" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700" class="phase-label">PHASE 4 · PoC 重放测试 (Phase 2 有核心发现立即开始)</text>

