  <text x="188" y="1240" fill="#94a3b8" font-size="10">Tier 退路</text>

  <text x="60" y="1265" fill="#475569" font-size="9">scripts: cdp-cookie-grabber.js · poc-bypass-test.js · replay-template.js | lib: baoyu-chrome-cdp.js | refs: workflow.md · cdp-auth-extraction.md</text>
  <text x="60" y="1282" fill="#475569" font-size="9">Phase 1.0 (NEW) — 三层回退: 缓存 → 已有 Chrome CDP → 新 Chrome 登录 | Tier 2 超时 30s / Tier 3 超时 120s</text>

  <!-- Lateral arrow: Phase 1.0 → Phase 1.1 -->
