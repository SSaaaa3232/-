  <rect x="150" y="1205" width="12" height="12" rx="2" fill="#7c3aed"/>
  <text x="168" y="1215" fill="#94a3b8" font-size="10">核心提取</text>

  <rect x="240" y="1205" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="258" y="1215" fill="#94a3b8" font-size="10">调用链复现</text>

  <rect x="340" y="1205" width="12" height="12" rx="2" fill="#059669"/>
  <text x="358" y="1215" fill="#94a3b8" font-size="10">PoC 测试</text>

  <rect x="430" y="1205" width="12" height="12" rx="2" fill="#e11d48"/>
  <text x="448" y="1215" fill="#94a3b8" font-size="10">报告</text>

  <rect x="490" y="1205" width="12" height="12" rx="2" fill="#d97706"/>
