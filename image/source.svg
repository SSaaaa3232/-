  <rect x="243" y="742" width="76" height="32" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
  <text x="281" y="757" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Layer 0</text>
  <text x="281" y="770" text-anchor="middle" fill="#94a3b8" font-size="8">Bypass 测试</text>

  <text x="323" y="758" fill="#475569" font-size="10">→</text>

  <rect x="335" y="742" width="76" height="32" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
  <text x="373" y="757" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Layer 1</text>
  <text x="373" y="770" text-anchor="middle" fill="#94a3b8" font-size="8">单账号全流程</text>

  <text x="415" y="758" fill="#475569" font-size="10">→</text>

  <rect x="427" y="742" width="76" height="32" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
  <text x="465" y="757" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Layer 2</text>
  <text x="465" y="770" text-anchor="middle" fill="#94a3b8" font-size="8">账号池轮换</text>

  <text x="507" y="758" fill="#475569" font-size="10">→</text>

  <rect x="519" y="742" width="58" height="32" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
  <text x="548" y="757" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">L3</text>
  <text x="548" y="770" text-anchor="middle" fill="#94a3b8" font-size="8">代理池</text>

  <text x="435" y="800" text-anchor="middle" fill="#64748b" font-size="9">不可跳过 Layer 0 — 空 auth/假签名/过期 token 先测服务器是否校验</text>

  <line x1="410" y1="815" x2="410" y2="845" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== PHASE 5: REPORTS ===== -->
  <rect x="280" y="850" width="260" height="80" rx="8" fill="url(#box-rose)" stroke="#fb7185" stroke-width="1"/>
  <rect x="280" y="850" width="260" height="26" rx="8" fill="#e11d48"/>
  <rect x="280" y="864" width="260" height="12" rx="0" fill="#e11d48"/>
  <text x="410" y="868" text-anchor="middle" fill="#ffe4e6" font-size="11" font-weight="700" class="phase-label">PHASE 5 · 报告输出</text>
  <text x="410" y="892" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">Reverse Report (9 章节)</text>
  <text x="410" y="907" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">Premium Bypass Report (如发现付费门控)</text>
  <text x="410" y="922" text-anchor="middle" fill="#64748b" font-size="9" class="phase-detail">report-template.md 模板 / 中文报告 / HIGH-MED-LOW</text>

  <line x1="410" y1="930" x2="410" y2="960" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== PHASE 6: BATCH AUTOMATION ===== -->
  <rect x="230" y="965" width="360" height="110" rx="8" fill="url(#box-amber)" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="230" y="965" width="360" height="26" rx="8" fill="#d97706"/>
  <rect x="230" y="979" width="360" height="12" rx="0" fill="#d97706"/>
  <text x="410" y="983" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700" class="phase-label">PHASE 6 · 批量自动化脚本</text>

  <!-- Gen 1-3 -->
  <rect x="243" y="1002" width="102" height="32" rx="6" fill="#5c2a0a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="294" y="1017" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Gen 1</text>
  <text x="294" y="1030" text-anchor="middle" fill="#94a3b8" font-size="8">单线程 · 零配置</text>

  <text x="349" y="1018" fill="#475569" font-size="11">→</text>

  <rect x="364" y="1002" width="102" height="32" rx="6" fill="#5c2a0a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="415" y="1017" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Gen 2</text>
  <text x="415" y="1030" text-anchor="middle" fill="#94a3b8" font-size="8">账号池轮换</text>

  <text x="470" y="1018" fill="#475569" font-size="11">→</text>

  <rect x="485" y="1002" width="92" height="32" rx="6" fill="#5c2a0a" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="531" y="1017" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Gen 3</text>
  <text x="531" y="1030" text-anchor="middle" fill="#94a3b8" font-size="8">账号 + 代理池</text>

  <text x="435" y="1058" text-anchor="middle" fill="#64748b" font-size="9">不可跳代 · 按 auth type 适配: 密码/Wallet/SMS/Token</text>

  <!-- ===== OUTPUT ===== -->
  <line x1="410" y1="1075" x2="410" y2="1105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="1110" width="220" height="38" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="410" y="1128" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">📋 产出: 报告 + PoC 脚本</text>
  <text x="410" y="1143" text-anchor="middle" fill="#94a3b8" font-size="9">protocol-level knowledge → downstream tools</text>

  <!-- ===== LEGEND ===== -->
  <line x1="60" y1="1170" x2="760" y2="1170" stroke="#334155" stroke-width="1"/>

