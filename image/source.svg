  <!-- Background -->
  <rect width="820" height="1340" rx="12" fill="url(#bg-grad)"/>
  <rect width="820" height="1340" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="-apple-system,'PingFang SC',sans-serif">reverse Skill — 完整工作流程</text>
  <text x="410" y="64" text-anchor="middle" fill="#64748b" font-size="12" font-family="-apple-system,'PingFang SC',sans-serif">Phase 1.0 → Phase 6 · 6 阶段产出可执行 PoC + 报告</text>
  <line x1="60" y1="78" x2="760" y2="78" stroke="#334155" stroke-width="1"/>

  <!-- ===== START NODE ===== -->
  <rect x="335" y="96" width="150" height="36" rx="18" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="410" y="119" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600" font-family="-apple-system,'PingFang SC',sans-serif">Start: /reverse URL</text>
  <line x1="410" y1="132" x2="410" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== DECISION: NEED LOGIN ===== -->
  <polygon points="410,158 510,185 410,212 310,185" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="410" y="188" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="-apple-system,'PingFang SC',sans-serif">需要登录态?</text>

  <!-- Left branch: YES -->
  <text x="352" y="178" fill="#34d399" font-size="10" class="arrow-label">Yes</text>
  <line x1="310" y1="180" x2="80" y2="180" stroke="#34d399" stroke-width="1.2"/>
  <line x1="80" y1="180" x2="80" y2="228" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

  <!-- Right branch: NO -->
  <text x="515" y="205" fill="#fbbf24" font-size="10" class="arrow-label">No / 公开站点</text>
  <line x1="510" y1="200" x2="740" y2="200" stroke="#fbbf24" stroke-width="1.2"/>
  <line x1="740" y1="200" x2="740" y2="440" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="740" y1="440" x2="640" y2="440" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== PHASE 1.0: CDP AUTH COLLECTION (left side) ===== -->
  <rect x="16" y="233" width="220" height="280" rx="8" fill="#0e3848" stroke="#22d3ee" stroke-width="1.5" opacity="0.95"/>
  <rect x="16" y="233" width="220" height="28" rx="8" fill="#0891b2"/>
  <rect x="16" y="249" width="220" height="12" rx="0" fill="#0891b2"/>
  <text x="126" y="252" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700" class="phase-label">PHASE 1.0 · CDP 快速认证收集</text>

  <!-- Tier 1 -->
  <rect x="28" y="275" width="196" height="44" rx="6" fill="url(#tier-box)" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="126" y="294" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700" class="tier-title">Tier 1 ⚡ 缓 存</text>
  <text x="126" y="309" text-anchor="middle" fill="#94a3b8" font-size="10" class="tier-detail">读 cookies.json → 验证 Session</text>

  <line x1="126" y1="319" x2="126" y2="330" stroke="#475569" stroke-width="1"/>

  <!-- Tier 2 -->
  <rect x="28" y="330" width="196" height="44" rx="6" fill="url(#tier-box)" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="126" y="349" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700" class="tier-title">Tier 2 🔍 已有 Chrome</text>
  <text x="126" y="364" text-anchor="middle" fill="#94a3b8" font-size="10" class="tier-detail">扫描调试端口 → 复用登录态</text>

  <line x1="126" y1="374" x2="126" y2="385" stroke="#475569" stroke-width="1"/>

  <!-- Tier 3 -->
  <rect x="28" y="385" width="196" height="44" rx="6" fill="url(#tier-box)" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="126" y="404" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700" class="tier-title">Tier 3 🚀 新 Chrome</text>
  <text x="126" y="419" text-anchor="middle" fill="#94a3b8" font-size="10" class="tier-detail">启动 → 用户登录 → 轮询抓取</text>

  <line x1="126" y1="429" x2="126" y2="445" stroke="#475569" stroke-width="1"/>

  <!-- Save & Exit -->
  <rect x="45" y="445" width="162" height="28" rx="6" fill="#0891b2" opacity="0.8"/>
  <text x="126" y="463" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">写入缓存 + 输出 Cookie</text>

  <line x1="236" y1="373" x2="280" y2="373" stroke="#22d3ee" stroke-width="1.2"/>

  <!-- ===== PHASE 1.1: INFO GATHERING ===== -->
  <rect x="290" y="342" width="240" height="88" rx="8" fill="url(#box-cyan)" stroke="#22d3ee" stroke-width="1"/>
  <rect x="290" y="342" width="240" height="26" rx="8" fill="#0891b2"/>
  <rect x="290" y="356" width="240" height="12" rx="0" fill="#0891b2"/>
  <text x="410" y="360" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700" class="phase-label">PHASE 1.1 · 信息收集 &amp; 防护评估</text>
  <text x="410" y="385" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">下载 JS Chunks → frm/lib/page/biz 分类</text>
  <text x="410" y="400" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">T0-T3 防护定级 → 观察确定 auth type</text>
  <text x="410" y="415" text-anchor="middle" fill="#cbd5e1" font-size="10" class="phase-detail">HAR 分析 → 匹配指纹库 / 自定义指纹</text>

  <line x1="410" y1="430" x2="410" y2="460" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

